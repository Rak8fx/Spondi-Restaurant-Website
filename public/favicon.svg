<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#1a0a00"/>
  <!-- Amphora silhouette -->
  <g fill="#d4a853">
    <!-- Amphora body -->
    <ellipse cx="32" cy="38" rx="12" ry="14"/>
    <!-- Neck -->
    <rect x="28" y="18" width="8" height="8" rx="2"/>
    <!-- Mouth/rim -->
    <rect x="24" y="15" width="16" height="4" rx="2"/>
    <!-- Handles -->
    <path d="M20 26 Q14 30 16 38 Q18 34 22 32" stroke="#d4a853" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M44 26 Q50 30 48 38 Q46 34 42 32" stroke="#d4a853" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- Base -->
    <ellipse cx="32" cy="51" rx="5" ry="2"/>
    <rect x="29" y="50" width="6" height="3" rx="1"/>
  </g>
</svg>
